<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jellojs — groupBy Bar Chart Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .header h1 span { color: #6c9fff; }
    .header p {
      margin-top: 0.5rem;
      color: #888;
      font-size: 0.9rem;
    }
    .feature-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: rgba(108,159,255,0.15);
      border: 1px solid rgba(108,159,255,0.3);
      border-radius: 20px;
      font-size: 0.75rem;
      color: #6c9fff;
      letter-spacing: 0.05em;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .control-group label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
    }
    .control-group.highlight label {
      color: #6c9fff;
    }
    .control-group.highlight select {
      border-color: #6c9fff;
    }
    select {
      background: #1a1a2e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    select:hover { border-color: #6c9fff; }
    select:focus { border-color: #6c9fff; box-shadow: 0 0 0 2px rgba(108,159,255,0.2); }
    .viz-container {
      width: 90%;
      max-width: 900px;
      height: 500px;
      margin: 1rem auto;
      background: #16162a;
      border-radius: 12px;
      border: 1px solid #222;
      position: relative;
      overflow: hidden;
    }
    .info-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.75rem;
      flex-wrap: wrap;
    }
    .info-item {
      font-size: 0.8rem;
      color: #888;
    }
    .info-item strong {
      color: #6c9fff;
    }
    .data-table {
      width: 90%;
      max-width: 900px;
      margin: 1rem auto 2rem;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .data-table th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #333;
      color: #6c9fff;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.7rem;
    }
    .data-table td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid #1a1a2e;
      color: #aaa;
    }
    .data-table tr:hover td { background: #1a1a2e; }
    .footer {
      text-align: center;
      padding: 1rem;
      color: #444;
      font-size: 0.75rem;
    }
    .footer a { color: #6c9fff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>jellojs</span> groupBy Layout</h1>
    <p>Aggregate data points by category — switch between circles and bar chart with smooth animation</p>
    <div class="feature-badge">NEW: Bar Chart Mode with Animated Transitions</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Group By</label>
      <select id="groupDim">
        <option value="industry">Industry</option>
        <option value="region">Region</option>
      </select>
    </div>
    <div class="control-group">
      <label>Aggregation</label>
      <select id="aggType">
        <option value="count">Count</option>
        <option value="sum">Sum</option>
        <option value="avg">Average</option>
        <option value="median">Median</option>
      </select>
    </div>
    <div class="control-group highlight">
      <label>Render As</label>
      <select id="renderAs">
        <option value="circles">Circles</option>
        <option value="bars">Bar Chart</option>
      </select>
    </div>
    <div class="control-group">
      <label>Size By</label>
      <select id="sizeBy">
        <option value="">— (use agg value)</option>
        <option value="employees">Employees</option>
        <option value="revenue">Revenue ($M)</option>
        <option value="valuation">Valuation ($B)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Sort By</label>
      <select id="sortBy">
        <option value="dim">Dimension</option>
        <option value="agg">Aggregated Value</option>
      </select>
    </div>
    <div class="control-group">
      <label>Order</label>
      <select id="sortOrder">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
    <div class="control-group">
      <label>Color By</label>
      <select id="colorBy">
        <option value="">None</option>
        <option value="industry">Industry</option>
        <option value="region">Region</option>
      </select>
    </div>
    <div class="control-group">
      <label>Layout</label>
      <select id="layoutType">
        <option value="groupby">Group By</option>
        <option value="default">Default (all items)</option>
        <option value="cluster">Cluster</option>
      </select>
    </div>
  </div>

  <div id="viz" class="viz-container"></div>

  <div class="info-bar" id="infoBar"></div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Company</th>
        <th>Industry</th>
        <th>Region</th>
        <th>Employees</th>
        <th>Revenue ($M)</th>
        <th>Valuation ($B)</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>

  <div class="footer">
    <a href="https://github.com/chngl/jellojs">github.com/chngl/jellojs</a> &middot;
    <a href="https://github.com/chngl/jellojs/tree/feature/groupby-barchart">feature/groupby-barchart</a>
  </div>

  <script src="jello.bundle.js"></script>
  <script>
    const Jello = JelloModule.default;

    const companies = [
      { id: '1',  company: 'Apple',     industry: 'Tech',    region: 'Americas', employees: 164000, revenue: 383,  valuation: 2800 },
      { id: '2',  company: 'Google',    industry: 'Tech',    region: 'Americas', employees: 182000, revenue: 307,  valuation: 1700 },
      { id: '3',  company: 'Microsoft', industry: 'Tech',    region: 'Americas', employees: 221000, revenue: 212,  valuation: 2500 },
      { id: '4',  company: 'Samsung',   industry: 'Tech',    region: 'Asia',     employees: 267000, revenue: 234,  valuation: 380 },
      { id: '5',  company: 'Tesla',     industry: 'Auto',    region: 'Americas', employees: 128000, revenue: 97,   valuation: 650 },
      { id: '6',  company: 'Toyota',    industry: 'Auto',    region: 'Asia',     employees: 375000, revenue: 275,  valuation: 250 },
      { id: '7',  company: 'BMW',       industry: 'Auto',    region: 'Europe',   employees: 149000, revenue: 155,  valuation: 72 },
      { id: '8',  company: 'JPMorgan',  industry: 'Finance', region: 'Americas', employees: 293000, revenue: 162,  valuation: 490 },
      { id: '9',  company: 'HSBC',      industry: 'Finance', region: 'Europe',   employees: 219000, revenue: 52,   valuation: 160 },
      { id: '10', company: 'ICBC',      industry: 'Finance', region: 'Asia',     employees: 430000, revenue: 215,  valuation: 220 },
      { id: '11', company: 'Pfizer',    industry: 'Health',  region: 'Americas', employees: 83000,  revenue: 58,   valuation: 160 },
      { id: '12', company: 'Roche',     industry: 'Health',  region: 'Europe',   employees: 103000, revenue: 66,   valuation: 210 },
      { id: '13', company: 'Nestle',    industry: 'Consumer',region: 'Europe',   employees: 275000, revenue: 99,   valuation: 310 },
      { id: '14', company: 'P&G',       industry: 'Consumer',region: 'Americas', employees: 107000, revenue: 84,   valuation: 370 },
      { id: '15', company: 'Sony',      industry: 'Tech',    region: 'Asia',     employees: 113000, revenue: 88,   valuation: 120 },
    ];

    const tbody = document.getElementById('dataBody');
    companies.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + c.company + '</td><td>' + c.industry + '</td><td>' + c.region + '</td><td>' + c.employees.toLocaleString() + '</td><td>' + c.revenue + '</td><td>' + c.valuation + '</td>';
      tbody.appendChild(tr);
    });

    const container = document.getElementById('viz');
    const jello = new Jello(container, companies, {});

    function updateViz() {
      const dim = document.getElementById('groupDim').value;
      const agg = document.getElementById('aggType').value;
      const renderAs = document.getElementById('renderAs').value;
      const sizeBy = document.getElementById('sizeBy').value;
      const sortBy = document.getElementById('sortBy').value;
      const sortOrder = document.getElementById('sortOrder').value;
      const colorBy = document.getElementById('colorBy').value;
      const layoutType = document.getElementById('layoutType').value;

      if (colorBy) {
        jello.colorBy(colorBy);
      } else {
        jello.colorBy(null);
      }

      if (sizeBy) {
        jello.sizeBy(sizeBy);
      } else {
        jello.sizeBy(null);
      }

      if (layoutType === 'groupby') {
        jello.groupBy({
          dim: dim,
          agg: agg,
          sortBy: sortBy,
          sortOrder: sortOrder,
          renderAs: renderAs,
        });
      } else if (layoutType === 'cluster') {
        jello.groupBy(null);
        jello.clusterBy(dim);
      } else {
        jello.groupBy(null);
        jello.options.layout = 'default';
      }

      jello.render();

      const infoBar = document.getElementById('infoBar');
      if (layoutType === 'groupby') {
        const groups = {};
        companies.forEach(c => {
          const key = c[dim];
          if (!groups[key]) groups[key] = [];
          groups[key].push(c);
        });
        const infoParts = Object.entries(groups).map(function(entry) {
          var key = entry[0], items = entry[1];
          var val;
          if (agg === 'count') {
            val = items.length;
          } else {
            var field = sizeBy || dim;
            var nums = items.map(function(i) { return i[field]; }).filter(function(v) { return typeof v === 'number'; });
            if (agg === 'sum') val = nums.reduce(function(a, b) { return a + b; }, 0);
            else if (agg === 'avg') val = nums.length ? Math.round(nums.reduce(function(a, b) { return a + b; }, 0) / nums.length) : 0;
            else if (agg === 'median') {
              nums.sort(function(a, b) { return a - b; });
              var mid = Math.floor(nums.length / 2);
              val = nums.length % 2 ? nums[mid] : Math.round((nums[mid - 1] + nums[mid]) / 2);
            }
          }
          return '<span class="info-item"><strong>' + key + '</strong>: ' + (typeof val === 'number' ? val.toLocaleString() : val) + '</span>';
        });
        infoBar.innerHTML = infoParts.join('');
      } else {
        infoBar.innerHTML = '<span class="info-item">' + companies.length + ' items</span>';
      }
    }

    document.querySelectorAll('select').forEach(function(sel) {
      sel.addEventListener('change', updateViz);
    });

    updateViz();
  </script>
</body>
</html>
